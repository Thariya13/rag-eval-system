[project]
name = "ragsys"
version = "0.1.0"
description = "Production-grade hybrid RAG over regulatory documents, with a rigorous evaluation and ablation harness"
readme = "README.md"
authors = [
    { name = "Tharindu Gunarathna", email = "iamthandu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.4",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0",
    "langchain-qdrant>=0.2.1",
    "langchain-text-splitters>=1.0",
    "langfuse>=3.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "tqdm>=4.66",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
]
cohere = [
    "langchain-cohere>=0.4",
]
eval = [
    "pandas>=2.0",
    "ragas>=0.2.15,<0.4",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ragsys = "ragsys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragsys"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
